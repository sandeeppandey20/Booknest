# Application metadata
spring.application.name=BookNest

# MySQL datasource configuration (primary production database)
# Replace the values below with your environment's MySQL connection details
# or define BOOKNEST_DB_URL / BOOKNEST_DB_USERNAME / BOOKNEST_DB_PASSWORD.
# This fallback profile uses an in-memory H2 database so the project can run immediately.
spring.datasource.url=${BOOKNEST_DB_URL:jdbc:h2:mem:booknest_db;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${BOOKNEST_DB_USERNAME:sa}
spring.datasource.password=${BOOKNEST_DB_PASSWORD:}
spring.datasource.driver-class-name=${BOOKNEST_DB_DRIVER:org.h2.Driver}

# Hibernate JPA configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=${BOOKNEST_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

# SQL logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Thymeleaf configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# Development tools
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false

# Server configuration
# Use BOOKNEST_PORT when provided; otherwise use the stable local port 8082.
server.port=${BOOKNEST_PORT:8082}
