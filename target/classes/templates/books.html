<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookNest - Books</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/dashboard}">BookNest</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
                <li class="nav-item"><a class="nav-link" th:href="@{/dashboard}">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">Books</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/logout}">Logout</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

    <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <div>
            <h1 class="page-title">My Books</h1>
            <p class="text-muted mb-0">Search, manage, and organize your library.</p>
        </div>
        <a class="btn btn-primary" th:href="@{/books/add}"><i class="bi bi-plus-lg"></i> Add Book</a>
    </div>

    <div class="card shadow-sm border-0 rounded-4 p-3 mb-4">
        <form th:action="@{/books/search}" method="get" class="row g-2 align-items-center">
            <div class="col-md-10">
                <input type="text" name="keyword" class="form-control" placeholder="Search by title or author" th:value="${keyword}">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-outline-primary w-100">Search</button>
            </div>
        </form>
    </div>

    <div class="card shadow-sm border-0 rounded-4">
        <div class="table-responsive">
            <table class="table align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Title</th>
                    <th>Author</th>
                    <th>ISBN</th>
                    <th>Genre</th>
                    <th>Status</th>
                    <th>Date Added</th>
                    <th class="text-end">Actions</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${#lists.isEmpty(books)}">
                    <td colspan="7" class="text-center text-muted py-4">No books found. Add your first book to begin.</td>
                </tr>
                <tr th:each="book : ${books}">
                    <td th:text="${book.title}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.isbn}"></td>
                    <td th:text="${book.genre}"></td>
                    <td>
                        <span class="badge rounded-pill" th:classappend="${book.status == 'COMPLETED' ? 'bg-success' : (book.status == 'READING' ? 'bg-warning text-dark' : 'bg-secondary')}">
                            <span th:text="${book.status}"></span>
                        </span>
                    </td>
                    <td th:text="${book.dateAdded}"></td>
                    <td class="text-end">
                        <a class="btn btn-sm btn-outline-primary me-2" th:href="@{/books/edit/{id}(id=${book.id})}">Edit</a>
                        <a class="btn btn-sm btn-outline-danger" th:href="@{/books/delete/{id}(id=${book.id})}">Delete</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
